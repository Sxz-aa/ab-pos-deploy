name: Build AB PoS tagged release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: ab-pos-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Release tag
        id: release
        run: |
          set -Eeuo pipefail
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]]; then
            prerelease=true
          elif [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            prerelease=false
          else
            printf 'ERROR: tag must be vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.NUMBER.\n' >&2
            exit 1
          fi
          printf 'prerelease=%s\n' "${prerelease}" >>"${GITHUB_OUTPUT}"

      - name: Build network artifacts
        run: |
          set -Eeuo pipefail
          if [[ "${{ steps.release.outputs.prerelease }}" == "true" ]]; then
            release_phase=candidate
          else
            release_phase=release
          fi
          found_network=false
          for share_dir in abpos/*/share; do
            [[ -s "${share_dir}/genesis.json" ]] || continue
            found_network=true
            network="$(basename "$(dirname "${share_dir}")")"
            make network \
              NETWORK="${network}" \
              VERSION="${GITHUB_REF_NAME}" \
              RELEASE_PHASE="${release_phase}"
            printf '%s\n' "${network}" >>build/release-networks.txt
          done
          [[ "${found_network}" == "true" ]] \
            || { printf 'ERROR: no populated network share directory was found.\n' >&2; exit 1; }

      - name: Compare with matching Candidate when available
        if: steps.release.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          candidate_prefix="${GITHUB_REF_NAME}-rc."
          releases_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
          candidate_tag="$(
            jq -r --arg prefix "${candidate_prefix}" '
              [
                .[]
                | select(.prerelease == true)
                | select(.tag_name | startswith($prefix))
                | select((.tag_name | ltrimstr($prefix)) | test("^[1-9][0-9]*$"))
              ]
              | sort_by(.published_at)
              | last
              | .tag_name // empty
            ' <<<"${releases_json}"
          )"
          if [[ -z "${candidate_tag}" ]]; then
            printf 'No matching Candidate Release was found; continuing without a Candidate comparison.\n'
            exit 0
          fi
          candidate_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${candidate_tag}")"
          mkdir -p build/candidate
          while IFS= read -r network; do
            candidate_asset="abpos-${network}-${candidate_tag}.tar.gz"
            if ! jq -e --arg name "${candidate_asset}" \
              'any(.assets[]; .name == $name)' <<<"${candidate_json}" >/dev/null; then
              printf 'Candidate %s has no %s asset; skipping its comparison.\n' \
                "${candidate_tag}" "${network}"
              continue
            fi
            gh release download "${candidate_tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern "${candidate_asset}" \
              --dir build/candidate
            ./scripts/verify-genesis-candidate.sh \
              "build/candidate/${candidate_asset}" \
              "build/abpos-${network}-${GITHUB_REF_NAME}.tar.gz"
          done <build/release-networks.txt

      - name: Prepare AB Geth release artifacts
        env:
          GETH_IMAGE: ghcr.io/${{ github.repository_owner }}/ab-geth
        run: |
          ./scripts/prepare-geth-release.sh

      - name: Publish versioned GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: ${{ steps.release.outputs.prerelease }}
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            build/abpos-*.tar.gz
            build/abpos-*.tar.gz.sha256
            build/ab-geth-*
