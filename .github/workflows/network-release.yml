name: Build AB PoS tagged release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: ab-pos-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select Release phase
        id: release
        run: |
          set -Eeuo pipefail
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]]; then
            release_phase=candidate
            prerelease=true
          elif [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            prerelease=false
            if [[ -s abpos/testnet/share/checkpoint_sync_urls.txt ]]; then
              release_phase=post-genesis
            else
              release_phase=genesis
            fi
          else
            printf 'ERROR: tag must be vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.NUMBER.\n' >&2
            exit 1
          fi
          printf 'release_phase=%s\n' "${release_phase}" >>"${GITHUB_OUTPUT}"
          printf 'prerelease=%s\n' "${prerelease}" >>"${GITHUB_OUTPUT}"

      - name: Build network artifacts
        run: |
          make network \
            VERSION="${GITHUB_REF_NAME}" \
            RELEASE_PHASE="${{ steps.release.outputs.release_phase }}"

      - name: Verify Final Genesis against Candidate
        if: steps.release.outputs.release_phase == 'genesis'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          candidate_prefix="${GITHUB_REF_NAME}-rc."
          releases_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
          candidate_tag="$(
            jq -r --arg prefix "${candidate_prefix}" '
              [
                .[]
                | select(.prerelease == true)
                | select(.tag_name | startswith($prefix))
                | select((.tag_name | ltrimstr($prefix)) | test("^[1-9][0-9]*$"))
              ]
              | sort_by(.published_at)
              | last
              | .tag_name // empty
            ' <<<"${releases_json}"
          )"
          [[ -n "${candidate_tag}" ]] || {
            printf 'ERROR: no published Candidate Release matches %s-rc.NUMBER.\n' \
              "${GITHUB_REF_NAME}" >&2
            exit 1
          }
          mkdir -p build/candidate
          gh release download "${candidate_tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "abpos-testnet-${candidate_tag}.tar.gz" \
            --dir build/candidate
          ./scripts/verify-genesis-candidate.sh \
            "build/candidate/abpos-testnet-${candidate_tag}.tar.gz" \
            "build/abpos-testnet-${GITHUB_REF_NAME}.tar.gz"

      - name: Prepare AB Geth release artifacts
        env:
          GETH_IMAGE: ghcr.io/${{ github.repository_owner }}/ab-geth
        run: |
          ./scripts/prepare-geth-release.sh

      - name: Publish versioned GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: ${{ steps.release.outputs.prerelease }}
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            build/abpos-*.tar.gz
            build/abpos-*.tar.gz.sha256
            build/ab-geth-*
