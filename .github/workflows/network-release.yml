name: Build AB PoS release draft

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: ab-pos-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build network artifacts
        run: |
          if [[ -s abpos/testnet/share/checkpoint_sync_urls.txt ]]; then
            release_phase=post-genesis
          else
            release_phase=genesis
          fi
          make network VERSION="${GITHUB_REF_NAME}" RELEASE_PHASE="${release_phase}"

      - name: Prepare AB Geth release artifacts
        env:
          GETH_IMAGE: ghcr.io/${{ github.repository_owner }}/ab-geth
        run: |
          ./scripts/prepare-geth-release.sh

      - name: Create GitHub Release draft
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            build/abpos-*.tar.gz
            build/abpos-*.tar.gz.sha256
            build/ab-geth-*
