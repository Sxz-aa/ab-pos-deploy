name: Promote AB PoS release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Versioned Network Release tag to promote
        required: true
        type: string
  release:
    types: [published, edited]

permissions:
  contents: write
  packages: write

concurrency:
  group: ab-pos-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Release artifacts
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name }}
        run: |
          set -Eeuo pipefail

          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] \
            || { printf 'ERROR: invalid Network Release tag: %s\n' "${RELEASE_TAG}" >&2; exit 1; }

          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          [[ "$(jq -r '.tag_name' <<<"${release_json}")" == "${RELEASE_TAG}" ]] \
            || { printf 'ERROR: Release tag does not match %s.\n' "${RELEASE_TAG}" >&2; exit 1; }
          if [[ "$(jq -r '.prerelease' <<<"${release_json}")" == "true" ]]; then
            if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
              printf 'ERROR: a Pre-release cannot be promoted: %s\n' \
                "${RELEASE_TAG}" >&2
              exit 1
            fi
            printf 'promote=false\n' >>"${GITHUB_OUTPUT}"
            printf 'Pre-release %s is not eligible for Latest or Docker latest.\n' \
              "${RELEASE_TAG}"
            exit 0
          fi

          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
            latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name' 2>/dev/null || true)"
            if [[ "${latest_tag}" != "${RELEASE_TAG}" ]]; then
              printf 'promote=false\n' >>"${GITHUB_OUTPUT}"
              printf 'Release %s was published or edited but is not Latest; Docker latest is unchanged.\n' \
                "${RELEASE_TAG}"
              exit 0
            fi
          fi

          mapfile -t network_archives < <(
            jq -r --arg tag "${RELEASE_TAG}" '
              .assets[].name
              | select(startswith("ab-geth-") | not)
              | select(endswith("-" + $tag + ".tar.gz"))
            ' <<<"${release_json}"
          )
          [[ "${#network_archives[@]}" -ge 1 ]] \
            || { printf 'ERROR: expected at least one Network archive for %s; found %s.\n' \
              "${RELEASE_TAG}" "${#network_archives[@]}" >&2; exit 1; }
          for archive in "${network_archives[@]}"; do
            jq -e --arg name "${archive}.sha256" \
              'any(.assets[]; .name == $name)' <<<"${release_json}" >/dev/null \
              || { printf 'ERROR: missing checksum for %s.\n' "${archive}" >&2; exit 1; }
          done

          for client in geth reth lighthouse; do
            mapfile -t binaries < <(
              jq -r '.assets[].name' <<<"${release_json}" \
                | sed -nE "s/^ab-${client}-(v[0-9]+\\.[0-9]+\\.[0-9]+-ab\\.[1-9][0-9]*)-linux-(amd64|arm64)$/\\1 &/p"
            )
            [[ "${#binaries[@]}" -ge 1 ]] \
              || { printf 'ERROR: Release does not contain an AB %s binary.\n' "${client}" >&2; exit 1; }
            unset client_versions
            declare -A client_versions=()
            for entry in "${binaries[@]}"; do
              version="${entry%% *}"
              asset="${entry#* }"
              client_versions["${version}"]=1
              jq -e --arg name "${asset}.sha256" \
                'any(.assets[]; .name == $name)' <<<"${release_json}" >/dev/null \
                || { printf 'ERROR: missing checksum for %s.\n' "${asset}" >&2; exit 1; }
            done
            [[ "${#client_versions[@]}" -eq 1 ]] \
              || { printf 'ERROR: Release contains more than one AB %s version.\n' "${client}" >&2; exit 1; }
            version="${!client_versions[@]}"
            printf 'ab_%s_version=%s\n' "${client}" "${version}" >>"${GITHUB_OUTPUT}"
            printf 'Validated %s with AB %s %s.\n' "${RELEASE_TAG}" "${client}" "${version}"
          done
          printf 'promote=true\n' >>"${GITHUB_OUTPUT}"

      - name: Verify immutable AB client images
        if: steps.release.outputs.promote == 'true'
        env:
          AB_GETH_VERSION: ${{ steps.release.outputs.ab_geth_version }}
          GETH_IMAGE: ghcr.io/sxz-aa/ab-geth
          AB_RETH_VERSION: ${{ steps.release.outputs.ab_reth_version }}
          RETH_IMAGE: ghcr.io/sxz-aa/ab-reth
          AB_LIGHTHOUSE_VERSION: ${{ steps.release.outputs.ab_lighthouse_version }}
          LIGHTHOUSE_IMAGE_REPOSITORY: ghcr.io/sxz-aa/ab-lighthouse
        run: |
          docker manifest inspect "${GETH_IMAGE}:${AB_GETH_VERSION}" >/dev/null
          docker manifest inspect "${RETH_IMAGE}:${AB_RETH_VERSION}" >/dev/null
          docker manifest inspect "${LIGHTHOUSE_IMAGE_REPOSITORY}:${AB_LIGHTHOUSE_VERSION}" >/dev/null

      - name: Promote GitHub Release
        if: github.event_name == 'workflow_dispatch' && steps.release.outputs.promote == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release edit "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --latest

      - name: Point AB Geth latest to the promoted Release version
        if: steps.release.outputs.promote == 'true'
        env:
          AB_GETH_VERSION: ${{ steps.release.outputs.ab_geth_version }}
          GETH_IMAGE: ghcr.io/sxz-aa/ab-geth
        run: |
          ./scripts/update-geth-latest.sh

      - name: Point AB Reth latest to the promoted Release version
        if: steps.release.outputs.promote == 'true'
        env:
          AB_RETH_VERSION: ${{ steps.release.outputs.ab_reth_version }}
          RETH_IMAGE: ghcr.io/sxz-aa/ab-reth
        run: |
          ./scripts/update-reth-latest.sh

      - name: Point AB Lighthouse latest to the promoted Release version
        if: steps.release.outputs.promote == 'true'
        env:
          AB_LIGHTHOUSE_VERSION: ${{ steps.release.outputs.ab_lighthouse_version }}
          LIGHTHOUSE_IMAGE_REPOSITORY: ghcr.io/sxz-aa/ab-lighthouse
        run: |
          ./scripts/update-lighthouse-latest.sh
